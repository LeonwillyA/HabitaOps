#config general

spring.application.name=HabitaOps

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.profiles.active=dev

# Comprobantes: carpetas y retención (BR-PY-013..017)
app.upload.tmp-dir=uploads/tmp
app.upload.approved-dir=uploads/approved
app.upload.rejected-dir=uploads/rejected
app.upload.approved-retention-years=20
app.upload.rejected-retention-days=30
app.upload.cleanup-cron=0 0 3 * * *



